<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --void:#0B0714; --panel:#171029; --panel2:#221838; --line:#33264F;
  --ink:#F3EEFF; --muted:#9A8FB8; --acc:#A78BFA;
  --display:'Arial Black','Archivo Black','Helvetica Neue',system-ui,sans-serif;
}
html,body{background:var(--void);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{padding:0 16px}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,7,20,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.htitle{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icobtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px}
.btn{width:100%;min-height:56px;border-radius:18px;border:none;font-family:var(--display);font-size:15px;text-transform:uppercase;background:var(--acc);color:var(--void);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.btn.ghost{background:transparent;border:2px solid var(--acc);color:var(--acc)}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.35}
h1.logo{font-family:var(--display);font-size:52px;line-height:.88;letter-spacing:-.04em;text-transform:uppercase}
.kicker{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:13.5px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gtile{border-radius:24px;padding:14px;text-align:left;min-height:142px;border:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column}
.gtile .em{font-size:24px}
.gtile .nm{font-family:var(--display);font-size:13.5px;text-transform:uppercase;line-height:1.05;margin-top:8px}
.gtile .tg{font-size:10.5px;margin-top:3px}
.gtile .ds{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.gtile:active{transform:scale(.96)}
.row{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:24px;font-family:var(--display)}
.stepper button.p{background:var(--acc);color:var(--void);border:none}
.stepper .n{flex:1;text-align:center;font-family:var(--display);font-size:42px;line-height:1}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 12px;margin-bottom:8px}
.pl .idx{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:13px;flex-shrink:0}
.pl input{flex:1;background:none;border:none;color:var(--ink);font-size:15px;font-weight:600;outline:none;min-width:0;font-family:inherit}
.chip{border-radius:999px;padding:9px 13px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--void)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:6px;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(11,7,20,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);max-width:560px;margin:0 auto}
nav.tabs button{flex:1;border:none;background:none;color:var(--muted);font-family:var(--display);font-size:11px;text-transform:uppercase;padding:8px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .e{font-size:18px}
nav.tabs button.on{color:var(--ink);background:var(--panel)}
.big{font-family:var(--display);line-height:1.06}
.center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:22px}
.hint{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--muted);font-size:12.5px;line-height:1.45}
.tapcard{min-height:64vh;border-radius:26px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.pill{border-radius:999px;padding:12px 20px;font-family:var(--display);font-size:13px;text-transform:uppercase}
.timer{position:relative;width:128px;height:128px;margin:0 auto}
.timer svg{transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:40px}
.g9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g9 div{min-height:74px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;font-weight:700;padding:4px;line-height:1.2}
.sec{border:1px solid var(--line);border-radius:20px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.sec>button{width:100%;display:flex;align-items:center;gap:12px;padding:16px;background:none;border:none;color:var(--ink);text-align:left}
.sec .st{font-family:var(--display);font-size:13.5px;text-transform:uppercase;flex:1;line-height:1.15}
.sec .sd{font-size:11px;color:var(--muted);margin-top:3px;font-family:inherit;text-transform:none;font-weight:400}
.sec .body{padding:0 16px 16px}
.blk{margin-top:14px}
.blk h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;color:#DED6F5}
.li:first-of-type{border-top:none}
.li .star{flex-shrink:0;font-size:15px;opacity:.28;background:none;border:none;padding:0;color:var(--ink)}
.li .star.on{opacity:1}
.li b{color:var(--ink)}
textarea{width:100%;min-height:200px;background:var(--panel);border:1px solid var(--line);border-radius:18px;color:var(--ink);padding:14px;font-size:14px;line-height:1.5;font-family:inherit;outline:none;resize:vertical}
.saved{position:fixed;top:calc(12px + env(safe-area-inset-top));right:16px;z-index:60;background:#34D399;color:#07130E;font-size:11px;font-weight:800;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.saved.show{opacity:1}
.sc{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.sc .b{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:18px;line-height:1}
.sc .b.p{background:#FB923C;color:var(--void);border:none}
.sc .v{font-family:var(--display);font-size:19px;width:32px;text-align:center}
.gal2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin-bottom:7px}
.wrow .tx{flex:1;font-size:14px;font-weight:600;line-height:1.35}
.wrow .tg{font-size:22px;flex-shrink:0}
.wrow.off{opacity:.42}
.wrow .act{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;min-width:46px;height:46px;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.wrow .act.on{background:#34D39922;border-color:#34D39966}
.wrow img.th{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0}
.wrow.off .tx{text-decoration:line-through}
.wrow:active{transform:scale(.985)}
.ghead{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.ghead .gt{flex:1;font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.gmini{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;font-family:inherit}
.ovl{position:fixed;inset:0;z-index:80;background:rgba(11,7,20,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:18px}
.ovl .box{max-width:430px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:18px;text-align:center;max-height:88vh;overflow:auto}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;font-family:inherit}
.tools button:active{transform:scale(.95)}
.tools .ilink{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;gap:5px}
.tools .ilink:active{transform:scale(.95)}
a.ilink{text-decoration:none}
.searchbar{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--ink);padding:13px 14px;font-size:14px;outline:none;font-family:inherit}
</style>

const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function catOf(txt){
  const t=norm(txt),toks=new Set(t.split(/[^a-z0-9]+/).filter(Boolean));
  let best="vie",sc=0;
  for(const c of CATDEF){
    if(!c.kw.length)continue;
    let s=0;
    for(const k of c.kw){const kn=norm(k);if(kn.includes(" ")||kn.includes("-")){if(t.includes(kn))s+=kn.length;}else if(toks.has(kn))s+=kn.length;}
    if(s>sc){sc=s;best=c.id;}
  }
  return best;
}

function itemText(g,it){
  if(typeof it==="string")return it;
  if(Array.isArray(it))return it.join(" ");
  if(it.mot)return it.mot+" "+it.tabous.join(" ");
  if(it.rep)return it.rep+" "+it.ind.join(" ");
  if(it.theme)return it.theme+" "+it.items.join(" ");

  if(it.t)return it.t+" "+it.l.join(" ");

}

const PERSO={id:"perso",em:"⭐",label:"Mes ajouts",kw:[]};
function catData(g){
  const cust=S.custom[g]||[],ck=g+"#"+cust.length;
  if(CATCACHE[ck])return CATCACHE[ck];
  const src=SRC[g]?SRC[g]():[],defs=g==="gage"?GAGECAT:CATDEF;
  const tag=g==="gage"?gageCatOf:catOf;
  const mine=new Set(cust.map(it=>banKey(g,it)));
  const map=src.map(it=>({it,c:mine.has(banKey(g,it))?"perso":tag(itemText(g,it))}));
  const present=[PERSO].concat(defs).filter(d=>map.some(m=>m.c===d.id));
  CATCACHE[ck]={map,present};
  return CATCACHE[ck];
}
function catsOn(g){
  const{present}=catData(g);
  const off=S.catsoff[g]||[];
  let on=present.filter(d=>!off.includes(d.id)).map(d=>d.id);
  if(!on.length)on=present.map(d=>d.id);
  return on;
}
function filteredDeck(g){
  const{map,present}=catData(g),on=catsOn(g);
  const ban=S.banned[g]||[];
  const out=map.filter(m=>on.includes(m.c)&&!ban.includes(banKey(g,m.it))&&!hasBannedWord(g,m.it)).map(m=>m.it);
  if(out.length)return out;
  const b2=map.filter(m=>!ban.includes(banKey(g,m.it))&&!hasBannedWord(g,m.it)).map(m=>m.it);
  return b2.length?b2:map.map(m=>m.it);
}

function addWord(w){

  S.words=S.words.concat(w);

}

  return `<img src="${u}" alt="" style="width:100%;max-width:${size||220}px;border-radius:16px;margin:12px auto 0;display:block;object-fit:cover">`;
}
function readPic(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const M=420,r=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.62));
    };
    im.onerror=()=>cb(null);
    im.src=fr.result;
  };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}
function picsSize(){
  let n=0;Object.values(S.pics).forEach(v=>n+=v.length);
  return (n/1024/1024*0.75).toFixed(1);

      <div class="big" style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)">Cartes retirées</div>
      <div style="flex:1;height:1px;background:var(--line)"></div>
    </div>
    <div class="mt">${rows.join("")||`<div class="sub center" style="padding:26px 0">Aucune carte retirée.</div>`}</div>
    ${rows.length?btn("Tout remettre","unbanall","#FB7185",true):""}
  </div>`;
}
function catChips(g){
  const{map,present}=catData(g);
  if(present.length<2)return "";
  const on=catsOn(g);
  return `<div class="chips" style="margin-top:10px">${present.map(d=>
    `<button class="chip${on.includes(d.id)?" on":""}" data-a="gcat" data-v="${g}|${d.id}">${d.em} ${d.label}</button>`).join("")}</div>`;
}

{id:"base",em:"🎬",t:"Les fondamentaux",d:"Valable pour absolument toutes les vidéos",blocks:[
 {h:"Les 2 premières secondes",items:[
  "Le spectateur décide en 2 secondes. Tout ce qui n'est pas le sujet doit disparaître de la première seconde : pas de logo, pas de « salut les gars », pas de contexte.",
  "Quatre hooks qui fonctionnent : <b>la promesse</b> (« il doit faire deviner ça sans dire ces trois mots »), <b>le conflit</b> (« celui qui perd prend le gage »), <b>l'image inexplicable</b> (on te voit déjà trempé), <b>la question impossible</b> (« qui gagne entre les deux ? »).",
  "Commence par le milieu. Le meilleur moment de la vidéo, mets-le en cold open de 3 secondes, puis reviens au début.",
  "Si tu dois expliquer avant de montrer, ton hook est mauvais. Montre, puis explique en une phrase pendant que ça bouge."]},
 {h:"La structure qui marche",items:[
  "<b>Vertical (15-35 s)</b> — Hook 2 s / Règle 3 s / Jeu 15 s / Payoff 5 s / Score 3 s. Une seule idée. Jamais deux.",
  "<b>Long (8-15 min)</b> — Cold open / promesse / montée en 3 paliers / point bas (le moment où ça rate) / payoff / bouton de fin qui ouvre la vidéo suivante.",
  "Le point bas est obligatoire. Une vidéo où tout se passe bien est une vidéo qu'on quitte à 40 %.",
  "Relance toutes les 5 à 8 secondes : une coupe, un son, un texte, une réaction. Aucun plan ne survit à 4 secondes sans changement."]},
 {h:"Ce qui fait rester et revenir",items:[
  "Le spectateur doit pouvoir <b>jouer avec vous</b>. Sur chaque jeu, laisse 2 secondes de silence avant la réponse : c'est là qu'il répond à voix haute chez lui.",
  "Le rewatch : cache un détail qu'on ne voit qu'à la deuxième vue. Une réaction en arrière-plan, un truc écrit sur un mur.",
  "Le commentaire : une prise de position tranchée, ou une erreur volontaire assumée. Les gens commentent pour corriger, pas pour féliciter.",
  "Termine par une raison de revenir : « la prochaine fois, on double la mise », « celui-là, il l'a payé la semaine d'après »."]},

{id:"cam",em:"📷",t:"Caméra & réglages",d:"Osmo Pocket 4 Pro · Action 6 · Mini 5 Pro",blocks:[
 {h:"Réglages de base (les deux caméras)",items:[
  "<b>Vitesse d'obturation = 2 × le nombre d'images.</b> 30 fps → 1/60. 60 fps → 1/120. C'est la règle qui donne le mouvement naturel. En plein soleil, filtre ND pour la tenir.",
  "<b>Balance des blancs en manuel.</b> 5600 K dehors, 3200 K en intérieur chaud. En auto, la couleur pompe dès que tu bouges et le montage devient impossible à raccorder.",
  "<b>ISO manuel</b>, plafonné à 3200. Au-delà, le bruit sur les visages ne se rattrape pas.",
  "Profil couleur : Normal avec saturation −1 si tu ne veux pas étalonner. D-Log M seulement si tu passes vraiment par l'étalonnage, sinon c'est du travail en plus pour rien.",
  "4K 60 pour tout ce qui bouge (jeux, sport, action). 4K 30 pour le parlé face caméra. 120 fps uniquement pour un ralenti prévu à l'avance."]},
 {h:"Pocket 4 Pro — le gimbal",items:[
  "FollowMode pour marcher, Tilt Locked pour les panoramiques propres. Recentre au double-tap avant chaque prise, pas pendant.",
  "La marche : genoux légèrement fléchis, coudes collés au corps, déroule le pied du talon à la pointe. Le gimbal corrige les tremblements, pas les à-coups verticaux.",
  "ActiveTrack pour te filmer seul en parlant : tu poses la caméra, tu bouges, elle te suit. C'est ce qui rend le vlog solo possible.",
  "Ne fais pas de mouvement gratuit. Un travelling doit révéler quelque chose : sinon, plan fixe."]},
 {h:"Action 6 — POV",items:[
  "4K 60 en champ large pour le POV. HorizonSteady seulement quand ça secoue vraiment : ça recadre et tu perds du champ.",
  "Fixations : poitrine pour la rando et la course (le plus stable), pied bas pour l'effet vitesse, casque pour le VTT.",
  "Sur un tatami, aucune caméra sur le corps pendant un sparring. Trépied au coin, angle bas, c'est plus beau et personne ne se blesse.",
  "Emporte toujours un chiffon microfibre : 90 % des plans ratés en extérieur, c'est une lentille sale."]},
 {h:"Drone — Mini 5 Pro",items:[
  "Trois plans suffisent pour une vidéo entière : <b>le reveal</b> (la caméra monte et découvre le paysage), <b>l'orbite lente</b> autour du sujet, <b>le dolly-out</b> qui recule et te laisse minuscule.",
  "Ne filme jamais uniquement à la verticale. 30 à 45° donne la profondeur, le nadir donne une carte postale plate.",
  "Vole lentement. Un drone rapide fait amateur ; un drone lent fait cinéma.",
  "Vérifie la réglementation avant chaque pays. Au Maroc, le drone à la douane est un vrai risque de saisie. En Suisse, les zones et distances sont strictes."]},
 {h:"Cadrage",items:[
  "Trois valeurs par scène, minimum : <b>large</b> (où on est), <b>moyen</b> (ce qui se passe), <b>détail</b> (mains, regard, objet). Sans le détail, le montage n'a pas de respiration.",
  "Règle des tiers : le regard vers l'espace vide, jamais vers le bord.",
  "Ne coupe jamais sur une articulation : ni au poignet, ni au genou, ni à la cheville. Coupe entre.",
  "Hauteur de caméra : à hauteur d'œil = neutre. Plus bas = puissance. Plus haut = fragilité. C'est un choix, pas un hasard.",
  "Une amorce au premier plan (une épaule, une plante, un montant de porte, légèrement flou) crée instantanément de la profondeur. C'est le truc le plus rentable du cadrage."]}]},

{id:"son",em:"🎧",t:"Son",d:"Ce que personne ne pardonne",blocks:[
 {h:"La règle",items:[
  "On pardonne une image moyenne. On ne pardonne jamais un mauvais son. Si tu dois investir 100 €, mets-les dans le son.",
  "Micro cravate sans fil pour tout ce qui est parlé. Bonnette anti-vent dès qu'il y a du vent, même léger — à partir de 10 km/h le micro nu est inutilisable.",
  "Dos au vent quand tu parles dehors. Toujours.",
  "<b>Room tone</b> : sur chaque lieu, enregistre 10 secondes de silence ambiant. Au montage, c'est ce qui colle les coupes ensemble et rend les raccords invisibles.",
  "Un clap ou un tape des mains au début de chaque prise multi-caméra. La synchro au montage prend alors 3 secondes au lieu de 10 minutes."]},
 {h:"Sound design",items:[
  "Whoosh sur les transitions rapides, impact grave sur la révélation, riser qui monte pendant le compte à rebours.",
  "<b>Le silence est l'outil le plus sous-estimé.</b> 0,3 seconde de silence total avant le payoff : ça multiplie l'effet par trois.",
  "La musique se choisit après le montage image, jamais avant. Si le montage tient sans musique, il est bon.",
  "Voix toujours au-dessus de la musique. Baisse la musique de 12 à 15 dB dès que quelqu'un parle."]}]},

{id:"lum",em:"💡",t:"Lumière",d:"Gratuite et décisive",blocks:[
 {h:"Extérieur",items:[
  "Golden hour : la première heure après le lever, la dernière avant le coucher. Tout est plus beau, sans exception.",
  "Midi en plein soleil est la pire lumière possible : ombres dures sous les yeux. Passe à l'ombre ouverte, ou attends.",
  "Ciel couvert = softbox géante gratuite. C'est idéal pour les visages.",
  "Ne filme jamais quelqu'un avec le soleil dans le dos sans compensation : soit tu exposes pour le visage et le ciel crame, soit l'inverse."]},
 {h:"Intérieur & face cam",items:[
  "Fenêtre à 45° du visage, jamais derrière toi. C'est déjà 80 % du résultat.",
  "Face cam gaming : une lumière principale côté visage, et une LED colorée derrière toi pour décoller du mur. Sans la deuxième, tu es plat.",
  "Ne mélange jamais lumière chaude et néon blanc dans le même plan : la peau devient verte et rien ne rattrape ça.",
  "Un fond légèrement plus sombre que le visage. Le regard va toujours vers le point le plus clair de l'image."]}]},

{id:"mont",em:"✂️",t:"Montage",d:"Workflow CapCut, dans l'ordre",blocks:[
 {h:"L'ordre de travail",items:[
  "<b>1. Dérushage</b> — tu regardes tout une fois et tu marques les bons moments. Rien d'autre.",
  "<b>2. Assemblage sans musique</b> — l'histoire d'abord, sans effet, sans son ajouté.",
  "<b>3. Rythme</b> — tu resserres, tu supprimes les respirations inutiles.",
  "<b>4. Musique</b>, <b>5. Sound design</b>, <b>6. Étalonnage</b>, <b>7. Textes et sous-titres</b>. Jamais dans le désordre : sinon tu passes trois heures à embellir un plan que tu vas couper."]},
 {h:"Les coupes",items:[
  "Coupe <b>sur</b> le mouvement, pas après. Quelqu'un se lève : tu coupes pendant qu'il se lève, l'œil ne voit pas la coupe.",
  "Coupe sur la réaction, jamais sur la fin de la phrase.",
  "<b>J-cut / L-cut</b> : le son du plan suivant démarre avant l'image (ou continue après). C'est ce qui différencie un montage fluide d'un diaporama.",
  "Zoom brutal de 1,1× pendant 4 images sur la punchline. Discret, mais l'œil le sent.",
  "Coupe tout ce qui est « je vais te dire un truc ». Garde le truc."]},
 {h:"Sous-titres et textes",items:[
  "Sous-titres obligatoires : la majorité regarde sans le son. 3 à 5 mots par ligne maximum.",
  "Place-les au tiers inférieur, pas tout en bas : sur TikTok, l'interface mange les 15 % du bas et les 10 % du haut.",
  "Un seul mot en couleur par phrase, sur le mot fort. Pas trois.",
  "Le compteur de score ou le chrono en overlay permanent = une raison mécanique de rester jusqu'à la fin."]},
 {h:"Étalonnage",items:[
  "Contraste léger, noirs pas totalement écrasés, saturation de la peau plutôt −5 que +5.",
  "Une seule LUT ou un seul réglage pour toute la chaîne. C'est ça, une identité visuelle : la même couleur sur trois vidéos et on vous reconnaît au défilement.",
  "Exporte en 4K si la source est en 4K, sinon 1080p 60 fps. Vertical : 1080×1920."]}]},

{id:"vlog",em:"🥋",t:"Vlog voyage & camps",d:"Brésil JJB · Daghestan lutte · tout camp",blocks:[
 {h:"Avant de partir",items:[
  "Écris la promesse en <b>une phrase</b> avant d'acheter le billet : « je pars m'entraîner un mois dans l'académie la plus dure de São Paulo ». Si tu ne peux pas la dire en une phrase, la vidéo n'existe pas encore.",
  "Repère à l'avance 3 lieux forts : l'académie, un lieu emblématique de la ville, un endroit où personne ne filme.",
  "Apprends dix phrases dans la langue. Ça change tout : l'accueil, les portes qui s'ouvrent, et ça fait un moment de vidéo.",
  "Prévois le double de batteries et de cartes que tu penses. Tu ne rechargeras jamais quand tu veux."]},
 {h:"Dans l'académie — la règle numéro un",items:[
  "<b>Demande au coach avant de sortir la caméra.</b> Toujours. C'est la différence entre être invité et être toléré. Un « no filming » découvert après coup, c'est le voyage entier perdu.",
  "Filme d'abord, entraîne-toi après ? Non. Entraîne-toi d'abord, gagne le respect, filme ensuite. Les meilleures images viennent quand ils t'ont accepté.",
  "Demande à chaque personne filmée en gros plan. Un pouce levé suffit, mais demande.",
  "Les détails racontent plus que le large : les mains qui serrent le kimono, les ceintures usées, les pieds sur le tatami, les oreilles cassées, la sueur sur le sol."]},
 {h:"La structure de la vidéo",items:[
  "<b>Cold open</b> : le moment le plus dur du voyage, 5 secondes, sans contexte.",
  "<b>La promesse</b> : « je suis parti à X pour Y, et je ne savais pas dans quoi je mettais les pieds ».",
  "<b>Jour 1</b> : l'arrivée, le choc, la salle vue de l'extérieur, le premier contact.",
  "<b>Le vrai contenu</b> : l'entraînement. Pas un résumé — un moment précis, un round, une technique, un partenaire.",
  "<b>Le moment où ça fait mal</b> : tu te fais démonter, tu doutes, tu veux rentrer. C'est ce plan qui fait la vidéo.",
  "<b>La leçon</b> : une phrase, pas un discours. Puis le bouton vers la suite."]},
 {h:"Interviews et rencontres",items:[
  "Pose ta question, puis <b>tais-toi trois secondes après la réponse</b>. La vraie phrase arrive dans ce silence. C'est la technique de tous les bons documentaristes.",
  "Ne pose pas de questions fermées. « Comment tu as commencé ? » plutôt que « tu as commencé jeune ? ».",
  "Filme le trajet : taxi, moto, bus, marché, rue. C'est la texture qui rend le voyage crédible. Une vidéo qui ne montre que la salle pourrait avoir été tournée n'importe où.",
  "Filme-toi en train de perdre. C'est la chose la plus rare et la plus regardée."]},
 {h:"Terrain — Brésil",items:[
  "Caméra rangée dans les transports et dans la rue passante. Sors-la, filme, range-la. Pas de matériel en évidence.",
  "Filme tôt le matin : lumière parfaite, rues calmes, moins de risque.",
  "Pas de drone en ville sans autorisation. Dans les zones résidentielles denses, oublie.",
  "Prends une deuxième carte SD et laisse une copie des rushes à l'hôtel chaque soir."]},
 {h:"Terrain — Daghestan / froid",items:[
  "Les batteries meurent au froid. Garde-les contre le corps, dans une poche intérieure, et sors-les au dernier moment.",
  "La condensation détruit les caméras : quand tu rentres au chaud, laisse la caméra dans le sac fermé 20 minutes avant de l'ouvrir.",
  "Demande systématiquement avant de filmer des personnes. Les codes locaux ne sont pas les mêmes, et le respect se voit à l'écran.",
  "Le silence, le froid, la buée, le bruit des pas : enregistre-les. C'est ce qui rendra la vidéo différente d'une salle de sport ordinaire."]}]},

{id:"minijeux",em:"🎮",t:"Mini-jeux face caméra",d:"Le format le plus rentable en temps",blocks:[
 {h:"Le décor permanent",items:[
  "Monte un décor fixe une fois, et ne le démonte plus. Fond simple, deux lampes colorées, une table, un objet central (buzzer, clochette, verre).",
  "Deux zones de couleur au sol ou derrière : rouge et bleu. Ça crée immédiatement l'idée d'arène, et ça se reconnaît au défilement.",
  "Un écran ou une feuille derrière qui affiche la manche en cours : ROUND 1 — CINÉMA. Ça structure l'image sans un mot d'explication.",
  "Le décor identique sur 30 vidéos = une identité. Le décor qui change à chaque fois = personne ne vous reconnaît."]},
 {h:"Deux caméras, deux rôles",items:[
  "<b>Caméra 1 — le chaos.</b> Fixe, grand angle, tout le monde dans le cadre. C'est la caméra de sécurité, elle tourne en continu et tu ne l'arrêtes jamais.",
  "<b>Caméra 2 — les réactions.</b> Serrée, à hauteur d'œil. Sur les visages, pas sur celui qui parle : <b>sur celui qui écoute.</b> C'est là que se trouve la vidéo.",
  "Si tu n'as qu'une caméra : place-la large et fixe, et compense par des zooms au montage. Ne bouge pas la caméra à la main pendant un jeu.",
  "Enregistre le son sur un micro d'ambiance central, pas sur la caméra."]},
 {h:"Comment tourner",items:[
  "Ne coupe pas entre les jeux. Tu enchaînes, tu découperas au montage. Les meilleurs moments sont dans les entre-deux.",
  "Ne rejoue jamais une réaction. Une réaction rejouée se voit en une demi-seconde.",
  "Les règles se disent en 5 secondes maximum, et pendant que le jeu commence déjà.",
  "Les gages doivent être <b>visibles à l'image</b> : eau glacée, chantilly, ballon qui éclate. Un gage verbal ne se filme pas.",
  "<b>Batch</b> : une journée, un décor, dix jeux. Tu sors dix verticaux et une vidéo longue. C'est trois semaines de publication en une journée."]},
 {h:"Le mot piégé — comment le filmer",items:[
  "Ne prononce pas le nom d'un jeu de société existant dans la vidéo. Donne-lui votre nom : « le mot piégé », « la faille », « le traître ».",
  "Filme la découverte du mot en gros plan sur le visage, jamais sur l'écran. Le spectateur ne doit pas savoir qui a quoi — c'est ça, le suspense.",
  "Affiche les deux mots au montage <b>seulement à la révélation</b>, en grand, avec un impact sonore.",
  "Le titre du vertical, c'est la situation, pas le jeu : « il a dit UN seul mot et il s'est grillé »."]},
 {h:"Titres qui marchent pour ces formats",items:[
  "« Fais deviner BATMAN sans dire ces 3 mots »",
  "« Il a 5 secondes pour trouver l'anime »",
  "« Celui qui perd prend le seau d'eau glacée »",
  "« On a trouvé l'intrus en 4 secondes »",
  "Jamais : « Nouveau jeu avec les potes #12 ». Le titre doit contenir la contrainte ou l'enjeu."]}]},

{id:"outdoorv",em:"🏔️",t:"Rando, bivouac, exploration",d:"Solo ou en groupe",blocks:[
 {h:"Ce qui fait la différence",items:[
  "Ce n'est pas un documentaire animalier, c'est <b>ton corps qui traverse un endroit</b>. Filme l'essoufflement, les mains, les pieds, le visage fatigué. C'est ça, le sujet.",
  "Filme le moment où tu doutes. Tout le monde filme le sommet ; presque personne ne filme les vingt minutes avant.",
  "Le son fait la moitié du travail : vent, pas dans la neige, réchaud qui s'allume, fermeture éclair de la tente, silence total. Enregistre-les séparément et remonte-les au montage.",
  "Trois plans par étape : le départ, l'effort, l'arrivée. Si tu as ça pour chaque segment, tu as une vidéo."]},
 {h:"Plans signature",items:[
  "<b>Le passage dans le cadre</b> : tu poses la caméra, tu t'éloignes, tu traverses, tu reviens la chercher. Le plan le plus efficace du solo, et il ne coûte rien.",
  "<b>Le time-lapse du montage de tente</b>, ou de la lumière qui tombe sur le bivouac.",
  "<b>L'hyperlapse de marche</b> sur un sentier : caméra en main, un pas toutes les deux images.",
  "<b>Le lever du soleil depuis le duvet</b> : caméra posée à côté de toi, tu ouvres les yeux, tu ouvres la tente. Ça vaut tous les plans de drone.",
  "<b>Le plan de nuit à la frontale</b> : le faisceau qui balaie le noir, c'est visuellement très fort et personne ne le fait."]},
 {h:"Bivouac — le faire proprement",items:[
  "Bivouac = une nuit, arrivée tard, départ tôt. Le camping installé en journée est interdit dans beaucoup d'endroits, et le montrer te discrédite.",
  "Zéro trace, zéro feu, zéro déchet — et <b>montre-le à l'écran</b>. Le plan où tu ramasses tout et où l'emplacement est intact, c'est ce qui te sépare des vidéos qu'on signale.",
  "Renseigne-toi sur la réglementation locale avant de publier une localisation. Certains spots se ferment à cause d'une seule vidéo virale.",
  "Batteries dans le duvet la nuit. Cartes SD dans une poche étanche."]},
 {h:"Solo vs groupe",items:[
  "<b>Solo</b> : tu parles à la caméra comme à quelqu'un. Pas de commentaire en voix off enregistré après — la voix sur le moment est toujours meilleure.",
  "<b>Groupe</b> : donne un rôle à chacun (celui qui râle, celui qui cuisine, celui qui pousse). Les rôles créent la narration toute seule.",
  "En groupe, une caméra par personne sur les moments forts. Le montage multi-angle vaut trois fois le mono-angle."]}]},

{id:"street",em:"🏙️",t:"Street & challenges",d:"Troc du stylo · cache-cache · rue",blocks:[
 {h:"Le troc — du stylo à l'objet cher",items:[

/* ============================================================
   SAUVEGARDE
   Écriture immédiate en mémoire du navigateur + écriture forcée
   dès que l'app passe en arrière-plan ou se ferme.
   ============================================================ */
const K_MAIN="arene:v1",K_PICS="arene:pics";
let STORE_OK=true;
function writeSync(k,v){
  try{localStorage.setItem(k,v);return true;}catch(e){STORE_OK=false;return false;}
}
function readSync(k){try{return localStorage.getItem(k);}catch(e){return null;}}
const store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k);if(r)return r.value;} }catch(e){}
    return readSync(k);
  },
  async set(k,v){
    const ok=writeSync(k,v);
    try{ if(window.storage){await window.storage.set(k,v);return true;} }catch(e){}
    return ok;
  }
};
function mainData(){
  return {players:S.players,ucCats:S.ucCats,ucUC:S.ucUC,ucMW:S.ucMW,cats:S.cats,catsoff:S.catsoff,
    banned:S.banned,words:S.words,custom:S.custom,favs:S.favs,notes:S.notes};
}
function tag(msg,ms){
  const t=document.getElementById("savedTag");if(!t)return;
  t.textContent=msg||"Sauvegardé";t.classList.add("show");
  setTimeout(()=>{t.classList.remove("show");t.textContent="Sauvegardé";},ms||900);
}
let saveTimer=null,picTimer=null;
function save(){
  writeSync(K_MAIN,JSON.stringify(mainData()));   // immédiat, rien ne peut être perdu
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const ok=await store.set(K_MAIN,JSON.stringify(mainData()));
    tag(ok?"Sauvegardé":"Mémoire pleine",ok?900:2200);
  },400);
}
function savePics(){
  const js=JSON.stringify(S.pics);
  const ok=writeSync(K_PICS,js);
  if(!ok){tag("Mémoire pleine — photo non enregistrée",2600);return;}
  clearTimeout(picTimer);
  picTimer=setTimeout(async()=>{await store.set(K_PICS,js);tag("Photo enregistrée",1200);},300);
}
function flush(){
  writeSync(K_MAIN,JSON.stringify(mainData()));
  writeSync(K_PICS,JSON.stringify(S.pics));
}
window.addEventListener("pagehide",flush);
window.addEventListener("beforeunload",flush);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush();});

async function load(){
  try{localStorage.setItem("arene:test","1");localStorage.removeItem("arene:test");}
  catch(e){STORE_OK=false;}
  const rp=await store.get(K_PICS);
  if(rp){try{S.pics=JSON.parse(rp)||{};}catch(e){}}
  const raw=await store.get(K_MAIN);
  if(!raw)return;
  try{
    const d=JSON.parse(raw);
    if(Array.isArray(d.players)&&d.players.length)S.players=d.players;
    if(Array.isArray(d.ucCats))S.ucCats=d.ucCats;
    if(typeof d.ucUC==="number")S.ucUC=d.ucUC;
    if(typeof d.ucMW==="boolean")S.ucMW=d.ucMW;
    if(d.cats)S.cats=d.cats;
    if(d.catsoff)S.catsoff=d.catsoff;
    if(d.banned)S.banned=d.banned;
    if(Array.isArray(d.words))S.words=d.words;
    if(d.custom)S.custom=d.custom;
    if(d.favs)S.favs=d.favs;
    if(typeof d.notes==="string")S.notes=d.notes;
    S.players.forEach(p=>{if(p.id>UID)UID=p.id;});
  }catch(e){}
}
/* --- sauvegarde de secours dans un fichier --- */
function exportSave(){
  const blob=new Blob([JSON.stringify({v:1,main:mainData(),pics:S.pics})],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="arene-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function importSave(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d||!d.main)throw 0;
      const m=d.main;
      if(Array.isArray(m.players)&&m.players.length)S.players=m.players;
      ["ucCats","cats","catsoff","banned","words","custom","favs"].forEach(k=>{if(m[k])S[k]=m[k];});
      if(typeof m.notes==="string")S.notes=m.notes;
      if(typeof m.ucUC==="number")S.ucUC=m.ucUC;
      if(typeof m.ucMW==="boolean")S.ucMW=m.ucMW;
      if(d.pics)S.pics=d.pics;
      S.players.forEach(p=>{if(p.id>UID)UID=p.id;});
      Object.keys(CATCACHE).forEach(k=>delete CATCACHE[k]);
      S.deck=[];flush();render();tag("Sauvegarde restaurée",1800);
    }catch(e){alert("Ce fichier n'est pas une sauvegarde de L'Arène.");}
  };
  fr.readAsText(file);
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
const shuffle=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const game=id=>GAMES.find(g=>g.id===id);
if(!S.ucCats)S.ucCats=UC_CATS.map(c=>c.id);

function setCount(n){
  n=Math.max(0,Math.min(20,n));
  if(n<S.players.length)S.players=S.players.slice(0,n);
  while(S.players.length<n){
    const i=S.players.length;
    S.players.push({id:uid(),name:"Joueur "+(i+1),color:AVATARS[i%AVATARS.length],score:0});
  }
  save();render();
}
function addPt(id,d){
  const p=S.players.find(x=>x.id===id);
  if(p){p.score=Math.max(0,p.score+d);save();render();}
}

function head(title,back,col,right){
  return `<header class="top">
    ${back?`<button class="icobtn" data-a="${back}">‹</button>`:""}
    <div class="htitle" style="color:${col||"var(--ink)"}">${esc(title)}</div>
    ${right||""}
  </header>`;
}
function gear(g){return `<button class="icobtn" data-a="gosetup" data-v="${g}">⚙️</button>`;}
function btn(label,action,col,ghost,val){
  return `<button class="btn${ghost?" ghost":""}" data-a="${action}" ${val!==undefined?`data-v="${val}"`:""} style="${ghost?`border-color:${col};color:${col}`:`background:${col}`}">${label}</button>`;
}
function timerHTML(left,total,col){
  const r=56,C=2*Math.PI*r,off=C*(1-(total?left/total:0)),d=left<=3;
  return `<div class="timer"><svg width="128" height="128">
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="${d?"#FB7185":col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s linear"/>
  </svg><div class="t" style="color:${d?"#FB7185":"var(--ink)"}">${left}</div></div>`;
}
function stepper(){
  return `<div class="row stepper">
    <button data-a="pminus">−</button>
    <div class="n">${S.players.length}</div>
    <button class="p" data-a="pplus">+</button>
  </div>`;
}

function ucStart(){
  const bp=S.banned.mot||[];
  const pool=UC_CATS.filter(c=>S.ucCats.includes(c.id)).flatMap(c=>c.pairs).concat(S.custom.mot||[]).filter(p=>!bp.includes(norm(p[0]+"|"+p[1]))&&!hasBannedWord("mot",p));
  const p=pick(pool),f=Math.random()<.5;
  S.pair={civil:f?p[0]:p[1],uc:f?p[1]:p[0]};
  const n=S.players.length,max=Math.max(1,Math.floor(n/3)-(S.ucMW?1:0));
  const slots=[];
  for(let i=0;i<Math.min(S.ucUC,max);i++)slots.push("uc");
  if(S.ucMW)slots.push("mw");
  while(slots.length<n)slots.push("civil");
  const mix=shuffle(slots);
  S.roles=S.players.map((p2,i)=>({pid:p2.id,name:p2.name,color:p2.color,role:mix[i],
    word:mix[i]==="civil"?S.pair.civil:mix[i]==="uc"?S.pair.uc:null,alive:true}));
  S.idx=0;S.rev=false;S.elim=null;S.out=null;S.mw=false;S.phase="reveal";render();
}
function ucWin(list){
  const a=list.filter(r=>r.alive),imp=a.filter(r=>r.role!=="civil").length,civ=a.length-imp;
  if(imp===0)return "civils"; if(imp>=civ)return "imposteurs"; return null;
}

/* --- CHRONO AVEUGLE --- */

function viewStudio(){
  const q=S.q.trim().toLowerCase();
  const favCount=Object.values(S.favs).filter(Boolean).length;
  let secs=STUDIO;
  if(q){
    secs=STUDIO.map(s=>({...s,blocks:s.blocks.map(b=>({...b,items:b.items.filter(it=>it.toLowerCase().includes(q)||b.h.toLowerCase().includes(q))})).filter(b=>b.items.length)}))
      .filter(s=>s.blocks.length||s.t.toLowerCase().includes(q));
  }
  return `<header class="top"><div class="htitle">Studio</div>
    <button class="icobtn" data-a="notes">📝</button></header>
  <div class="wrap" style="padding-top:14px">
    <div class="sub" style="margin-bottom:12px">Tout ce qu'il faut pour tourner, cadrer, dire et monter. Touche ☆ pour épingler une idée${favCount?` — ${favCount} épinglée${favCount>1?"s":""}`:""}.</div>
    <input class="searchbar" placeholder="Chercher (drone, hook, bivouac, live…)" value="${esc(S.q)}" data-q="1">
    ${favCount?`<div class="chips" style="margin-top:10px"><button class="chip${S.openSec==="__fav"?" on":""}" data-a="sec" data-v="__fav">⭐ Mes idées épinglées (${favCount})</button></div>`:""}
    <div style="margin-top:14px">
      ${S.openSec==="__fav"?viewFavs():secs.map(s=>viewSec(s,!!q)).join("")||`<div class="hint">Aucun résultat.</div>`}

}
function viewSec(s,forceOpen){
  const open=forceOpen||S.openSec===s.id;
  return `<div class="sec">
    <button data-a="sec" data-v="${s.id}">
      <div style="font-size:21px">${s.em}</div>
      <div class="st">${s.t}<div class="sd">${s.d}</div></div>
      <div style="color:var(--muted);font-size:15px">${open?"−":"+"}</div>
    </button>
    ${open?`<div class="body">${s.blocks.map((b,bi)=>`<div class="blk"><h4>${b.h}</h4>
      ${b.items.map((it,ii)=>{const k=s.id+":"+bi+":"+ii;
        return `<div class="li"><button class="star${S.favs[k]?" on":""}" data-a="fav" data-v="${k}">${S.favs[k]?"★":"☆"}</button><div>${it}</div></div>`;}).join("")}
      </div>`).join("")}</div>`:""}
  </div>`;
}
function viewFavs(){
  const out=[];
  STUDIO.forEach(s=>s.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{
    const k=s.id+":"+bi+":"+ii;
    if(S.favs[k])out.push(`<div class="li"><button class="star on" data-a="fav" data-v="${k}">★</button><div><span style="color:var(--acc);font-size:11px;text-transform:uppercase">${s.em} ${s.t}</span><br>${it}</div></div>`);
  })));
  return `<div class="sec"><div class="body" style="padding-top:16px">${out.join("")||"<div class='sub'>Rien d'épinglé.</div>"}</div></div>`;
}
function viewNotes(){
  return head("Mes idées","studio","#34D399")+`<div class="wrap">
    <div class="hint">Note ici les idées de vidéo, les titres, les lieux. Sauvegardé automatiquement.</div>
    <div class="mt"><textarea data-notes="1" placeholder="Idée de vidéo…&#10;&#10;- Cache-cache Petite France, 2 caméras&#10;- Troc du stylo, départ Place Kléber&#10;- Camp JJB São Paulo : demander au coach J1">${esc(S.notes)}</textarea></div>
  </div>`;
}

/* ============================================================
   RENDU
   ============================================================ */
function render(){
  const app=document.getElementById("app");
  let html="";
  if(S.screen==="add")html=viewAdd(S.sg);
  else if(S.screen==="pics")html=viewPics();
  else if(S.tab==="reglages"){ html = S.screen==="cat"?viewCat(S.sg,S.sc):S.screen==="gameset"?viewGameSet(S.sg):viewSettings(); }
  else if(S.tab==="studio"){ html = S.screen==="notes"?viewNotes():viewStudio(); }
  else if(S.screen==="home")html=viewHome();
  else if(S.screen==="mot")html=viewMot();
  else if(S.screen==="indices")html=viewIndices();
  else if(S.screen==="intrus")html=viewIntrus();
  else if(S.screen==="combat")html=viewCombat();
  else if(S.screen==="score")html=viewScore();
  else if(S.screen==="setup")html=viewSetup(S.sg);
  else if(S.screen==="bombe")html=viewBombe();
  else if(S.screen==="vf")html=viewVF();
  else if(S.screen==="top5")html=viewTop5();
  else if(S.screen==="chrono")html=viewChrono();
  else if(DECKS[S.screen])html=viewDeck(S.screen);
  else html=viewHome();
  app.innerHTML=html+viewPick()+viewPicSel();
  document.getElementById("tabs").innerHTML=`
    <button class="${S.tab==="jeux"?"on":""}" data-a="tab" data-v="jeux"><span class="e">🎲</span>Jeux</button>
    <button class="${S.tab==="studio"?"on":""}" data-a="tab" data-v="studio"><span class="e">🎬</span>Studio</button>
    <button class="${S.tab==="reglages"?"on":""}" data-a="tab" data-v="reglages"><span class="e">⚙️</span>Réglages</button>`;
}

/* ============================================================
   CHRONO
   ============================================================ */
setInterval(()=>{
  if(!S.running)return;
  if(S.left>0){S.left--;render();}
  if(S.left===0){S.running=false;render();}
},1000);

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.name){const p=S.players.find(x=>String(x.id)===t.dataset.name);if(p){p.name=t.value;save();}}
  if(t.dataset.notes){S.notes=t.value;save();}
  if(t.dataset.w!==undefined){S.winput=t.value;}
  if(t.dataset.f!==undefined){S.form[t.dataset.f]=t.value;}
  if(t.dataset.pw!==undefined){S.picw=t.value;}
  if(t.dataset.wq!==undefined){S.wq=t.value;const pos=t.selectionStart;render();
    const nt=document.querySelector("[data-wq]");if(nt){nt.focus();nt.setSelectionRange(pos,pos);}}
  if(t.dataset.q!==undefined){S.q=t.value;const pos=t.selectionStart;render();
    const nt=document.querySelector("[data-q]");if(nt){nt.focus();nt.setSelectionRange(pos,pos);}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.imp!==undefined&&t.files&&t.files[0]){importSave(t.files[0]);return;}
  if(t.dataset&&t.dataset.pic!==undefined&&t.files&&t.files[0]){
    const term=decodeURIComponent(t.dataset.pic);
    readPic(t.files[0],d=>{
      if(!d){alert("Image illisible.");return;}
      S.pics[picKey(term)]=d;savePics();render();
    });
  }
});
document.addEventListener("click",e=>{
  // un lien fait son travail tout seul : on n'intercepte jamais un clic dessus
  if(e.target.closest("a[href]"))return;
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  const resetRun=()=>{S.deck=[];S.di=0;S.step=0;S.shown=false;S.running=false;S.left=0;S.duo=null;
    S.bombArmed=false;S.cStart=0;S.cResult=null;S.cTarget=0;};
  switch(a){
    case "tab": S.tab=v;S.screen=v==="studio"?"studio":v==="reglages"?"settings":"home";render();break;
    case "gosettings": S.tab="reglages";S.screen="settings";render();break;
    case "gameset": S.tab="reglages";S.sg=v;S.wq="";S.screen="gameset";render();break;
    case "backgame": S.screen="gameset";S.wq="";render();break;
    case "gocat":{const[g6,c6]=v.split("|");S.tab="reglages";S.sg=g6;S.sc=c6;S.wq="";S.screen="cat";render();break;}
    case "calloff":{const[g7,c7]=v.split("|");const ks=catItems(g7,c7).map(x=>x.k);
      const b=S.banned[g7]||[];S.banned[g7]=b.concat(ks.filter(k=>!b.includes(k)));
      S.deck=[];save();render();break;}
    case "callon":{const[g8,c8]=v.split("|");const ks=catItems(g8,c8).map(x=>x.k);
      S.banned[g8]=(S.banned[g8]||[]).filter(k=>!ks.includes(k));
      if(!S.banned[g8].length)delete S.banned[g8];
      S.deck=[];save();render();break;}
    case "pickpic": S.picsel=JSON.parse(decodeURIComponent(v));render();break;
    case "closepic": if(e.target.closest(".box")&&e.target.dataset.a!=="closepic")break; S.picsel=null;render();break;
    case "home": S.screen="home";resetRun();render();break;
    case "open":
      resetRun();
      if(v==="mot"){S.phase="config";S.screen="mot";}
      else if(hasSetup(v)){S.sg=v;S.screen="setup";render();break;}
      else S.screen=v;
      if(DECKS[v])S.left=DECKS[v].timer;
      if(v==="intrus")S.left=10;
      render();break;
    case "pplus": setCount(S.players.length+1);break;
    case "pminus": setCount(S.players.length-1);break;
    case "pset": setCount(+v);break;
    case "pdel": S.players=S.players.filter(p=>String(p.id)!==v);save();render();break;
    // mot piégé
    case "motcfg": S.phase="config";render();break;
    case "motorder": S.phase="order";render();break;
    case "uccat": S.ucCats=S.ucCats.includes(v)?(S.ucCats.length>1?S.ucCats.filter(x=>x!==v):S.ucCats):S.ucCats.concat(v);save();render();break;
    case "ucplus": S.ucUC=Math.min(Math.max(1,Math.floor(S.players.length/3)-(S.ucMW?1:0)),S.ucUC+1);save();render();break;
    case "ucminus": S.ucUC=Math.max(1,S.ucUC-1);save();render();break;
    case "ucmw": S.ucMW=!S.ucMW;save();render();break;
    case "ucgo": ucStart();break;
    case "uctap":
      if(!S.rev){S.rev=true;}
      else if(S.idx+1>=S.players.length){S.order=shuffle(S.players.map(p=>p.name));S.phase="order";}
      else {S.idx++;S.rev=false;}
      render();break;
    case "ucvote": S.phase="vote";render();break;
    case "ucelim":{
      const t=S.roles.find(r=>String(r.pid)===v);t.alive=false;S.elim=t;
      if(t.role==="mw"){S.mw=true;S.phase="elim";}
      else{const w=ucWin(S.roles);S.out=w;S.phase=w?"end":"elim";}
      render();break;}
    case "mwyes": S.mw=false;S.out="muet";S.phase="end";render();break;
    case "mwno":{S.mw=false;const w=ucWin(S.roles);S.out=w;S.phase=w?"end":"elim";render();break;}
    case "ucaward":{
      const win=S.roles.filter(r=>S.out==="civils"?r.role==="civil":S.out==="muet"?r.role==="mw":r.role!=="civil");
      win.forEach(w=>{const p=S.players.find(x=>x.id===w.pid);if(p)p.score+=3;});
      save();S.screen="home";render();break;}
    // decks
    case "dnext":
      S.di=(S.di+1)%S.deck.length;S.step=0;S.shown=false;S.running=false;
      S.left=S.screen==="intrus"?10:(DECKS[S.screen]?DECKS[S.screen].timer:0);
      render();break;
    case "dtimer": S.running=!S.running;if(S.left===0)S.left=DECKS[S.screen].timer;render();break;
    case "istep": S.step++;render();break;
    case "ireveal": S.step=4;render();break;
    case "itimer": S.running=true;S.left=10;render();break;
    case "ishow": S.shown=true;S.running=false;render();break;
    case "cnew": S.duo=shuffle(filteredDeck("combat")).slice(0,2);S.crit=shuffle(CRITERES).slice(0,3);render();break;
    // bombe
    case "bstart": S.left=18+Math.floor(Math.random()*28);S.bombArmed=true;S.running=true;render();break;
    case "bstop": S.running=false;S.bombArmed=false;S.left=0;render();break;
    case "bnext": S.di=(S.di+1)%S.deck.length;S.running=false;S.bombArmed=false;S.left=0;render();break;
    // vrai / faux
    case "vfshow": S.step=1;render();break;
    // top 5
    case "tstep": S.step=Math.min(5,S.step+1);render();break;
    // chrono aveugle
    case "cgo": S.cStart=Date.now();S.cResult=null;render();break;
    case "cstop": S.cResult=(Date.now()-S.cStart)/1000-S.cTarget;S.cStart=0;render();break;
    case "pickword":{
      const list=wordsOf(v,S.deck[S.di]).filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,14);
      S.pick={g:v,list};render();break;}
    case "closepick": if(e.target.closest(".box")&&e.target.dataset.a!=="closepick")break; S.pick=null;render();break;
    case "wban": addWord(decodeURIComponent(v));S.pick=null;render();break;
    case "waddbtn": addWord(S.winput);S.winput="";render();break;
    case "wdel":{const w=decodeURIComponent(v);S.words=S.words.filter(x=>x!==w);S.deck=[];save();render();break;}
    case "ban": banCurrent(v);S.pick=null;render();break;
    case "banpair":{const k=norm(S.pair.civil+"|"+S.pair.uc);
      S.banned.mot=(S.banned.mot||[]).concat(k);save();S.phase="config";render();break;}
    case "wpair": S.pick={g:"mot",list:[S.pair.civil,S.pair.uc]};render();break;
    case "gobanned": S.ret=S.screen;S.screen="banned";render();break;
    case "unban":{const[g2,k2]=v.split("|");const key=decodeURIComponent(k2);
      S.banned[g2]=(S.banned[g2]||[]).filter(x=>x!==key);
      if(!S.banned[g2].length)delete S.banned[g2];
      S.deck=[];save();render();break;}
    case "unbanall": S.banned={};S.deck=[];save();render();break;
    case "goadd": S.ret=S.screen;S.sg=v;S.form={};S.screen="add";render();break;
    case "gopics": S.picw="";S.ret=S.screen;S.screen="pics";render();break;
    case "expsave": exportSave();break;
    case "fbool": S.form.bool=v==="1";render();break;
    case "fadd":{
      const F=formOf(v);
      if(!F.ok(S.form||{})){alert("Il manque un champ.");break;}
      S.custom[v]=(S.custom[v]||[]).concat([F.make(S.form)]);
      S.form={};S.deck=[];save();render();break;}
    case "fdel":{const[g5,i5]=v.split("|");
      S.custom[g5]=(S.custom[g5]||[]).filter((_,i)=>i!==+i5);
      if(!S.custom[g5].length)delete S.custom[g5];
      S.deck=[];save();render();break;}
    case "picdel":{const k=decodeURIComponent(v);delete S.pics[k];savePics();render();break;}
    case "gosetup": S.sg=v;S.screen="setup";render();break;
    case "backsetup": S.screen=S.ret||"setup";S.ret=null;render();break;
    case "gowords": S.ret=S.screen;S.sg=v;S.wq="";S.screen="words";render();break;
    case "gowordsall": S.screen="banned";render();break;
    case "play":{
      const g=v;S.sg=g;S.tab="jeux";S.ret=null;resetRun();
      if(g==="mot"){S.phase="config";S.screen="mot";render();break;}
      S.screen=g;
      if(DECKS[g])S.left=DECKS[g].timer;
      if(g==="intrus")S.left=10;
      render();break;}
    case "tog":{
      const g=el.dataset.v,k=decodeURIComponent(el.dataset.k),b=S.banned[g]||[];
      S.banned[g]=b.includes(k)?b.filter(x=>x!==k):b.concat(k);
      if(!S.banned[g].length)delete S.banned[g];
      S.deck=[];save();render();break;}
    case "wopen": S.wopen=S.wopen===v?null:v;render();break;
    case "gall":{const[g3,c3]=v.split("|");const gr=wordGroups(g3).find(x=>x.id===c3);
      const b=S.banned[g3]||[];S.banned[g3]=b.concat(gr.items.map(x=>x.k).filter(k=>!b.includes(k)));
      S.deck=[];save();render();break;}
    case "gnone":{const[g4,c4]=v.split("|");const gr=wordGroups(g4).find(x=>x.id===c4);
      const ks=gr.items.map(x=>x.k);S.banned[g4]=(S.banned[g4]||[]).filter(k=>!ks.includes(k));
      if(!S.banned[g4].length)delete S.banned[g4];
      S.deck=[];save();render();break;}
    case "gcat":{
      const [g,c]=v.split("|");const on=catsOn(g);
      const off=S.catsoff[g]||[];
      if(on.includes(c)){ if(on.length>1)S.catsoff[g]=off.concat(c); }
      else S.catsoff[g]=off.filter(x=>x!==c);
      if(S.catsoff[g]&&!S.catsoff[g].length)delete S.catsoff[g];
      S.deck=[];S.di=0;S.step=0;S.shown=false;S.running=false;S.duo=null;S.bombArmed=false;
      save();render();break;}
    case "cnew2": S.cTarget=7+Math.floor(Math.random()*9);S.cStart=0;S.cResult=null;render();break;
    // score
    case "splus": addPt(+v,1);break;
    case "sminus": addPt(+v,-1);break;
    case "sreset": S.players.forEach(p=>p.score=0);save();render();break;
    // studio
    case "sec": S.openSec=S.openSec===v?null:v;render();break;
    case "fav": S.favs[v]=!S.favs[v];save();render();break;
    case "notes": S.screen="notes";render();break;
    case "studio": S.screen="studio";render();break;
  }
});

/* démarrage */
load().then(render);
</script>
